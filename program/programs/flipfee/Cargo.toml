[package]
name = "flipfee"
version = "0.1.0"
description = "flipfee: sell a pump.fun coin's creator fees by the hour; the program routes every fee to the hour's buyer or the dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "flipfee"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"

[dev-dependencies]
litesvm = "0.16.0"
solana-account = "4.3"
solana-clock = "3.1"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
solana-transaction = "4"
serde_json = "1"
base64 = "0.22"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
